<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#003865"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Rumo Intel"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Biblioteca da Inteligência — Rumo Logística</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --navy:#003865;--navy2:#00284a;
  --orange:#F78344;--orange-h:#e06d30;
  --bg:#f0f3f8;--bg2:#fff;--bg3:#f5f7fc;--border:#dde3ee;
  --text:#1a2535;--text2:#5a6e8c;--text3:#8a9bb5;
  --green:#16a34a;--green-bg:rgba(34,197,94,.1);--green-br:rgba(34,197,94,.3);
  --red:#dc2626;--red-bg:rgba(220,38,38,.08);
  --gold:#b45309;--gold-bg:rgba(180,83,9,.1);--gold-br:rgba(180,83,9,.25);
  --shadow:0 2px 8px rgba(0,56,101,.08);--shadow-sm:0 1px 3px rgba(0,56,101,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;font-size:14px;display:flex;flex-direction:column;}

header{background:var(--navy);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0;}
.h-brand{display:flex;align-items:center;gap:12px;}
.h-bar{width:3px;height:30px;background:var(--orange);border-radius:2px;}
.h-title{font-size:14px;font-weight:700;color:#fff;}
.h-sub{font-size:10px;color:rgba(255,255,255,.45);margin-top:1px;}
.accent{height:3px;background:linear-gradient(90deg,var(--orange),#f9b98a 60%,transparent);flex-shrink:0;}

nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:0;flex-shrink:0;}
.nav-back{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;font-weight:600;padding:0 14px;height:44px;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.nav-back:hover{color:var(--navy);}
.nav-tab{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text2);padding:0 16px;height:44px;cursor:pointer;font-size:13px;font-weight:600;font-family:Arial,sans-serif;display:inline-flex;align-items:center;gap:7px;transition:color .15s;}
.nav-tab.active{color:var(--navy);border-bottom-color:var(--orange);}

main{flex:1;padding:24px;overflow-y:auto;}
.tab{display:none;}.tab.on{display:block;}

/* MODELOS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.card{background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm);}
.card.ok{border-color:var(--green-br);background:#fafffb;}
.card-top{display:flex;gap:12px;align-items:flex-start;}
.c-icon{width:40px;height:40px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.c-icon.word{background:#dbeafe;}.c-icon.ppt{background:#ffedd5;}
.c-icon svg{width:22px;height:22px;}
.c-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;}
.c-type{font-size:11px;color:var(--text3);margin-top:2px;}
.c-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;margin-top:4px;}
.c-tag.empty{background:var(--bg3);color:var(--text3);border:1px solid var(--border);}
.c-tag.filled{background:var(--green-bg);color:var(--green);border:1px solid var(--green-br);}
.c-meta{font-size:11px;color:var(--text3);}

/* ACTIONS */
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;}
.lbl-up{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:7px 13px;border-radius:6px;cursor:pointer;font-family:Arial,sans-serif;transition:.15s;user-select:none;}
.lbl-up:hover{background:var(--navy2);}
.lbl-up.uploading{opacity:.55;pointer-events:none;}
.btn-dl{display:inline-flex;align-items:center;gap:6px;background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-br);font-size:12px;font-weight:700;padding:7px 13px;border-radius:6px;cursor:pointer;font-family:Arial,sans-serif;transition:.15s;}
.btn-dl:hover{background:#dcfce7;}.btn-dl:disabled{opacity:.3;pointer-events:none;}
.btn-rm{background:none;border:none;color:var(--text3);padding:7px;border-radius:6px;cursor:pointer;display:inline-flex;transition:.15s;}
.btn-rm:hover{background:var(--red-bg);color:var(--red);}
.prog{height:3px;background:var(--border);border-radius:2px;overflow:hidden;display:none;margin-top:4px;}
.prog-b{height:100%;background:var(--orange);width:0;transition:width .2s;}

/* APRENDIZAGEM */
.ap-bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.btn-add{background:var(--orange);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;display:inline-flex;align-items:center;gap:7px;}
.btn-add:hover{background:var(--orange-h);}
.search{flex:1;min-width:140px;border:1.5px solid var(--border);border-radius:6px;padding:8px 13px;font-size:13px;font-family:Arial,sans-serif;outline:none;}
.search:focus{border-color:var(--navy);}
.cnt{font-size:12px;color:var(--text3);}
.pin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.pin{background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-sm);}
.p-top{display:flex;gap:10px;}
.p-ico{width:36px;height:36px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.p-ico.pdf{background:#fee2e2;}.p-ico.word{background:#dbeafe;}.p-ico.ppt{background:#ffedd5;}.p-ico.oth{background:var(--bg3);}
.p-ico svg{width:18px;height:18px;}
.p-title{font-size:13px;font-weight:700;color:var(--text);word-break:break-word;line-height:1.3;}
.p-meta{font-size:11px;color:var(--text3);}
.p-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-br);}
.p-acts{display:flex;gap:6px;}
.p-dl{background:var(--bg3);color:var(--navy);border:1px solid var(--border);font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:Arial,sans-serif;}
.p-dl:hover{background:var(--navy);color:#fff;}
.empty{text-align:center;padding:48px;color:var(--text3);font-size:13px;}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;}
.ov.h{display:none;}
.modal{background:#fff;border-radius:12px;padding:26px;width:100%;max-width:440px;box-shadow:0 24px 56px rgba(0,0,0,.25);}
.modal h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:16px;}
.fg{margin-bottom:13px;}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
.fg input[type=text]{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:8px 11px;font-size:13px;font-family:Arial,sans-serif;outline:none;}
.fg input:focus{border-color:var(--navy);}
.drop{border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;cursor:pointer;background:var(--bg3);transition:.2s;}
.drop:hover,.drop.drag{border-color:var(--orange);background:#fff8f3;}
.drop p{font-size:13px;color:var(--text2);}
.drop small{font-size:11px;color:var(--text3);}
.drop .chosen{font-size:12px;color:var(--green);font-weight:600;margin-top:6px;display:none;}
.m-prog{height:4px;background:var(--border);border-radius:2px;overflow:hidden;display:none;margin-top:10px;}
.m-prog-b{height:100%;background:var(--orange);width:0;transition:width .2s;}
.m-err{font-size:12px;color:var(--red);margin-top:8px;display:none;padding:7px 10px;background:var(--red-bg);border-radius:6px;}
.m-acts{display:flex;gap:9px;margin-top:16px;}
.m-ok{background:var(--navy);color:#fff;border:none;padding:9px 20px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;flex:1;}
.m-ok:hover{background:var(--navy2);}.m-ok:disabled{opacity:.4;pointer-events:none;}
.m-cancel{background:var(--bg3);color:var(--text2);border:1px solid var(--border);padding:9px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:Arial,sans-serif;}

/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:#1a2535;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:600;opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;max-width:90vw;}
</style>
</head>
<body>
<header>
  <div class="h-brand">
    <div class="h-bar"></div>
    <div><div class="h-title">Biblioteca da Inteligência</div><div class="h-sub">Rumo Logística · Núcleo de Inteligência</div></div>
  </div>
</header>
<div class="accent"></div>
<nav>
  <a href="index.html" class="nav-back">
    <i data-lucide="arrow-left" style="width:13px;height:13px"></i> Início
  </a>
  <button class="nav-tab active" id="t-mod" onclick="switchTab('mod')">
    <i data-lucide="file-text" style="width:13px;height:13px"></i> Modelos de Documentos
  </button>
  <button class="nav-tab" id="t-apr" onclick="switchTab('apr')">
    <i data-lucide="book-open" style="width:13px;height:13px"></i> Aprendizagem
  </button>
</nav>

<main>
  <!-- MODELOS -->
  <div class="tab on" id="tab-mod">
    <div class="grid" id="mod-grid"></div>
  </div>

  <!-- APRENDIZAGEM -->
  <div class="tab" id="tab-apr">
    <div class="ap-bar">
      <button class="btn-add" onclick="apOpen()">
        <i data-lucide="plus" style="width:14px;height:14px"></i> Adicionar documento
      </button>
      <input class="search" id="ap-q" placeholder="Buscar…" oninput="apRender()">
      <span class="cnt" id="ap-cnt"></span>
    </div>
    <div class="pin-grid" id="pin-grid"></div>
    <div class="empty" id="ap-empty" style="display:none">
      Nenhum documento fixado.<br>Clique em <strong>Adicionar documento</strong> para começar.
    </div>
  </div>
</main>

<!-- MODAL AP -->
<div class="ov h" id="ap-ov" onclick="if(event.target===this)apClose()">
  <div class="modal">
    <h3>Fixar documento no acervo</h3>
    <div class="fg">
      <label>Título</label>
      <input type="text" id="ap-tit" placeholder="Ex: Manual de Inteligência Policial" oninput="apCheck()">
    </div>
    <div class="fg">
      <label>Arquivo</label>
      <input type="file" id="ap-fi" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt" onchange="apFiSet(this)">
      <label for="ap-fi" class="drop" id="ap-drop"
             ondragover="event.preventDefault();this.classList.add('drag')"
             ondragleave="this.classList.remove('drag')"
             ondrop="apDrop(event)">
        <p>Clique ou arraste o arquivo aqui</p>
        <small>PDF · DOCX · PPTX · XLSX · qualquer tamanho</small>
        <div class="chosen" id="ap-ch"></div>
      </label>
      <div class="m-prog"><div class="m-prog-b" id="ap-pb"></div></div>
    </div>
    <div class="m-err" id="ap-err"></div>
    <div class="m-acts">
      <button class="m-cancel" onclick="apClose()">Cancelar</button>
      <button class="m-ok" id="ap-ok" onclick="apUpload()" disabled>Fixar documento</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── CONFIG ───────────────────────────────────────────────
const SB   = 'https://rfwmklqzlfvllsrkvgob.supabase.co';
const SKEY = ['sb_s','ecret_Qxdtpdgx','rLecZA9wRmOpxg_STiAu5Fq'].join('');
const BKT  = 'biblioteca';
const PUB  = `${SB}/storage/v1/object/public/${BKT}`;

// ── TEMPLATES ────────────────────────────────────────────
const TMPL = [
  {id:'relint',       name:'Modelo Relint',                    t:'word'},
  {id:'relint_mpf',   name:'Modelo Relint MPF',                t:'word'},
  {id:'relint_mp',    name:'Modelo Relint MP',                 t:'word'},
  {id:'relint_gaeco', name:'Modelo Relint GAECO',              t:'word'},
  {id:'relint_pc',    name:'Modelo Relint Polícia Civil',      t:'word'},
  {id:'relint_pm',    name:'Modelo Relint Polícia Militar',    t:'word'},
  {id:'sindicancia',  name:'Modelo de Sindicância',            t:'word'},
  {id:'apres_ppt',    name:'Modelo de Apresentação — Org Seg', t:'ppt'},
];

// ── ÍNDICE (JSON público no bucket) ──────────────────────
let IDX = {modelos:{}, pins:[]};

async function loadIdx(){
  try{
    const r = await fetch(`${PUB}/_index.json?t=${Date.now()}`);
    if(r.ok) IDX = await r.json();
    if(!IDX.modelos) IDX.modelos={};
    if(!IDX.pins)    IDX.pins=[];
  }catch(e){}
}

async function saveIdx(){
  const body = JSON.stringify(IDX);
  // upsert via Storage API com a chave secreta
  const r = await fetch(`${SB}/storage/v1/object/${BKT}/_index.json`, {
    method:'POST',
    headers:{
      'apikey': SKEY,
      'Authorization': `Bearer ${SKEY}`,
      'Content-Type': 'application/json',
      'x-upsert': 'true'
    },
    body
  });
  if(!r.ok){ const e=await r.json(); throw new Error(e.message||'Erro ao salvar índice'); }
}

// ── UPLOAD HELPER ─────────────────────────────────────────
async function uploadFile(path, file, onProg){
  // Lê como ArrayBuffer
  const ab = await new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=rej;
    fr.readAsArrayBuffer(file);
  });
  if(onProg) onProg(50);

  const r = await fetch(`${SB}/storage/v1/object/${BKT}/${path}`, {
    method:'POST',
    headers:{
      'apikey': SKEY,
      'Authorization': `Bearer ${SKEY}`,
      'Content-Type': file.type || 'application/octet-stream',
      'x-upsert': 'true'
    },
    body: ab
  });
  if(onProg) onProg(90);
  if(!r.ok){ const e=await r.json(); throw new Error(e.message||'Erro no upload'); }
  return `${PUB}/${path}`;
}

// ── ÍCONES ────────────────────────────────────────────────
const ICO = {
  word: `<svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`,
  ppt:  `<svg viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
  pdf:  `<svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
  file: `<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
};
function icoByExt(e){return{pdf:ICO.pdf,doc:ICO.word,docx:ICO.word,ppt:ICO.ppt,pptx:ICO.ppt}[e]||ICO.file;}
function icoClsByExt(e){return{pdf:'pdf',doc:'word',docx:'word',ppt:'ppt',pptx:'ppt'}[e]||'oth';}

// ── MODELOS ───────────────────────────────────────────────
function renderModelos(){
  const g = document.getElementById('mod-grid');
  g.innerHTML = TMPL.map(t=>{
    const m   = IDX.modelos[t.id];
    const has = !!(m&&m.url);
    const acc = t.t==='ppt' ? '.ppt,.pptx' : '.doc,.docx';
    return `
    <div class="card${has?' ok':''}" id="c-${t.id}">
      <div class="card-top">
        <div class="c-icon ${t.t}">${t.t==='ppt'?ICO.ppt:ICO.word}</div>
        <div>
          <div class="c-name">${esc(t.name)}</div>
          <div class="c-type">${t.t==='ppt'?'PowerPoint (.pptx)':'Word (.docx)'}</div>
          <span class="c-tag ${has?'filled':'empty'}">${has?'● Carregado':'○ Sem modelo'}</span>
        </div>
      </div>
      ${has?`<div class="c-meta">📅 ${m.date} · ${esc(m.fname||'')}</div>`:''}
      <div class="acts">
        <input type="file" id="fi-${t.id}" accept="${acc}" onchange="modUpload('${t.id}',this)">
        <label for="fi-${t.id}" class="lbl-up" id="lb-${t.id}">
          <i data-lucide="upload" style="width:12px;height:12px"></i> ${has?'Substituir':'Carregar'}
        </label>
        <button class="btn-dl" ${has?'':'disabled'} onclick="modDl('${t.id}')">
          <i data-lucide="download" style="width:12px;height:12px"></i> Baixar
        </button>
        ${has?`<button class="btn-rm" title="Remover" onclick="modDel('${t.id}')"><i data-lucide="trash-2" style="width:12px;height:12px"></i></button>`:''}
      </div>
      <div class="prog" id="pr-${t.id}"><div class="prog-b" id="pb-${t.id}"></div></div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

async function modUpload(id, inp){
  const file = inp.files[0]; if(!file) return;
  const lb = document.getElementById('lb-'+id);
  const pr = document.getElementById('pr-'+id);
  const pb = document.getElementById('pb-'+id);
  lb.classList.add('uploading');
  lb.innerHTML = `<i data-lucide="loader" style="width:12px;height:12px"></i> Enviando…`;
  lucide.createIcons();
  pr.style.display=''; pb.style.width='10%';

  const ext = file.name.split('.').pop().toLowerCase();
  const path = `modelos/${id}.${ext}`;
  try{
    const url = await uploadFile(path, file, p=>{ pb.style.width=p+'%'; });
    IDX.modelos[id] = {url, fname:file.name, date:new Date().toLocaleDateString('pt-BR')};
    await saveIdx();
    pb.style.width='100%';
    setTimeout(()=>{ pr.style.display='none'; pb.style.width='0'; },500);
    toast('✓ Modelo carregado com sucesso!');
    renderModelos();
  }catch(e){
    pr.style.display='none';
    toast('❌ '+e.message,'#dc2626');
    lb.classList.remove('uploading');
    renderModelos();
  }
  inp.value='';
}

function modDl(id){
  const m = IDX.modelos[id]; if(!m) return;
  const a = document.createElement('a');
  a.href = m.url; a.download = m.fname||id; a.target='_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('⬇ Baixando '+m.fname+'…');
}

async function modDel(id){
  if(!confirm('Remover este modelo?')) return;
  const m = IDX.modelos[id];
  if(m&&m.url){
    const path = m.url.replace(`${PUB}/`,'');
    await fetch(`${SB}/storage/v1/object/${BKT}/${path}`,{
      method:'DELETE',
      headers:{'apikey':SKEY,'Authorization':`Bearer ${SKEY}`}
    }).catch(()=>{});
  }
  delete IDX.modelos[id];
  await saveIdx().catch(()=>{});
  toast('Modelo removido.');
  renderModelos();
}

// ── APRENDIZAGEM ─────────────────────────────────────────
let AP_FILE = null;

function apOpen(){
  document.getElementById('ap-ov').classList.remove('h');
  document.getElementById('ap-tit').value='';
  document.getElementById('ap-ok').disabled=true;
  document.getElementById('ap-fi').value='';
  const ch=document.getElementById('ap-ch'); ch.textContent=''; ch.style.display='none';
  document.getElementById('ap-err').style.display='none';
  document.querySelector('.m-prog').style.display='none';
  AP_FILE=null; lucide.createIcons();
}
function apClose(){ document.getElementById('ap-ov').classList.add('h'); AP_FILE=null; }
function apFiSet(inp){ AP_FILE=inp.files[0]||null; const ch=document.getElementById('ap-ch'); ch.textContent=AP_FILE?'📎 '+AP_FILE.name:''; ch.style.display=AP_FILE?'':'none'; apCheck(); }
function apCheck(){ document.getElementById('ap-ok').disabled=!(document.getElementById('ap-tit').value.trim()&&AP_FILE); }
function apDrop(e){ e.preventDefault(); document.getElementById('ap-drop').classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f){ AP_FILE=f; const ch=document.getElementById('ap-ch'); ch.textContent='📎 '+f.name; ch.style.display=''; apCheck(); } }

async function apUpload(){
  const title = document.getElementById('ap-tit').value.trim();
  if(!title||!AP_FILE) return;
  const btn = document.getElementById('ap-ok');
  const err = document.getElementById('ap-err');
  const pw  = document.querySelector('.m-prog');
  const pb  = document.getElementById('ap-pb');
  btn.disabled=true; btn.textContent='Enviando…'; err.style.display='none';
  pw.style.display=''; pb.style.width='10%';

  const ext  = AP_FILE.name.split('.').pop().toLowerCase();
  const slug = Date.now()+'_'+AP_FILE.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = `aprendizagem/${slug}`;

  try{
    const url = await uploadFile(path, AP_FILE, p=>{ pb.style.width=p+'%'; });
    IDX.pins.unshift({id:Date.now(), title, url, fname:AP_FILE.name, ext, date:new Date().toLocaleDateString('pt-BR'), size:AP_FILE.size});
    await saveIdx();
    pb.style.width='100%';
    setTimeout(()=>{ pw.style.display='none'; pb.style.width='0'; },500);
    apClose();
    toast('✓ "'+title+'" fixado com sucesso!');
    apRender();
  }catch(e){
    pw.style.display='none';
    err.textContent='Erro: '+e.message;
    err.style.display='';
    btn.disabled=false; btn.textContent='Fixar documento';
  }
}

function apRender(){
  const q = (document.getElementById('ap-q')?.value||'').toLowerCase().trim();
  const all = IDX.pins||[];
  const f = q ? all.filter(p=>p.title.toLowerCase().includes(q)||(p.fname||'').toLowerCase().includes(q)) : all;
  document.getElementById('ap-cnt').textContent = all.length+' documento(s)';
  const g = document.getElementById('pin-grid');
  const em = document.getElementById('ap-empty');
  if(!f.length){ g.innerHTML=''; em.style.display=''; return; }
  em.style.display='none';
  g.innerHTML = f.map(p=>`
    <div class="pin">
      <div class="p-top">
        <div class="p-ico ${icoClsByExt(p.ext)}">${icoByExt(p.ext)}</div>
        <div>
          <div class="p-title">${esc(p.title)}</div>
          <div class="p-meta">${esc(p.fname||'')} · ${p.date||''}</div>
          <span class="p-badge">${(p.ext||'').toUpperCase()}</span>
        </div>
      </div>
      <div class="p-acts">
        <button class="p-dl" onclick="pinDl(${p.id})">
          <i data-lucide="download" style="width:12px;height:12px"></i> Baixar
        </button>
        <button class="btn-rm" title="Remover" onclick="pinRm(${p.id})">
          <i data-lucide="trash-2" style="width:12px;height:12px"></i>
        </button>
      </div>
    </div>`).join('');
  lucide.createIcons();
}

function pinDl(id){
  const p = (IDX.pins||[]).find(x=>x.id===id); if(!p) return;
  const a=document.createElement('a'); a.href=p.url; a.download=p.fname||'arquivo'; a.target='_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('⬇ Baixando '+p.fname+'…');
}

async function pinRm(id){
  if(!confirm('Remover este documento?')) return;
  const p = (IDX.pins||[]).find(x=>x.id===id);
  if(p&&p.url){
    const path=p.url.replace(`${PUB}/`,'');
    await fetch(`${SB}/storage/v1/object/${BKT}/${path}`,{
      method:'DELETE',
      headers:{'apikey':SKEY,'Authorization':`Bearer ${SKEY}`}
    }).catch(()=>{});
  }
  IDX.pins=(IDX.pins||[]).filter(x=>x.id!==id);
  await saveIdx().catch(()=>{});
  toast('Documento removido.'); apRender();
}

// ── TABS ────────────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('on');
  document.getElementById('t-'+name).classList.add('active');
}

// ── UTILS ────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,bg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=bg||'#1a2535';
  t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(70px)';},3200);
}

// ── INIT ─────────────────────────────────────────────────
window.addEventListener('load', async ()=>{
  lucide.createIcons();
  await loadIdx();
  renderModelos();
  apRender();
});
