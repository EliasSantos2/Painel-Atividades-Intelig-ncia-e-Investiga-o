<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Dados</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
  .box { background: #fff; border-radius: 14px; padding: 32px 28px; max-width: 440px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
  h2 { color: #003865; margin-bottom: 6px; text-align: center; }
  p { color: #6b82a0; font-size: 13px; margin-bottom: 24px; text-align: center; }
  .btn { background: #003865; color: #fff; border: none; border-radius: 8px; padding: 13px 20px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 12px; }
  .btn:hover { background: #F78344; }
  .btn-sec { background: #f0f4f8; color: #003865; border: 1px solid #D8E3F0; }
  .btn-sec:hover { background: #D8E3F0; }
  .status { margin-top: 16px; font-size: 13px; font-weight: 600; min-height: 20px; text-align: center; }
  .ok { color: #1E8449; } .err { color: #C0392B; } .info { color: #005CA9; }
  hr { border: none; border-top: 1px solid #e8edf5; margin: 20px 0; }
  label { font-size: 12px; color: #6b82a0; display: block; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="box">
  <h2>🔄 Recuperar Dados</h2>
  <p>Restaure os dados do painel a partir do localStorage ou de um arquivo de backup.</p>

  <button class="btn" onclick="restaurarLocalStorage()">Restaurar do localStorage deste dispositivo</button>

  <hr>
  <label>Ou selecione um arquivo de backup (.json):</label>
  <input type="file" id="backup-file" accept=".json" onchange="restaurarArquivo(this)" style="font-size:13px;width:100%;margin-bottom:12px">

  <div class="status" id="status"></div>
</div>

<script>
const KEY = ['eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmd21rbHF6bGZ2bGxzcmt2Z29iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMzg4NzIsImV4cCI6MjA5NzgxNDg3Mn0','xwJItVzF3jW46BtMQBLSNj3rT64G0dybPZQZ_k-QlTM'].join('.');
const SUPA_URL = 'https://rfwmklqzlfvllsrkvgob.supabase.co';

function status(msg, cls) {
  const el = document.getElementById('status');
  el.className = 'status ' + (cls||'');
  el.textContent = msg;
}

async function enviar(dados) {
  status('Enviando para o servidor…', 'info');
  const sb = supabase.createClient(SUPA_URL, KEY);

  // Tenta com sessão autenticada primeiro
  const { data: { session } } = await sb.auth.getSession();

  const r = await fetch(SUPA_URL + '/rest/v1/painel_inv?id=eq.1', {
    method: 'PATCH',
    headers: {
      'apikey': KEY,
      'Authorization': `Bearer ${session?.access_token || KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ data: dados })
  });

  if (r.ok) {
    // Salva também no localStorage
    localStorage.setItem('painel_inv_v3', JSON.stringify(dados));
    const ops = Array.isArray(dados) ? dados.length : (dados.operacoes?.length ?? '?');
    status(`✅ ${ops} operações restauradas com sucesso!`, 'ok');
  } else {
    status('❌ Erro ' + r.status + '. Faça login no painel e tente novamente.', 'err');
  }
}

async function restaurarLocalStorage() {
  const raw = localStorage.getItem('painel_inv_v3');
  if (!raw) { status('❌ Nenhum dado encontrado neste dispositivo.', 'err'); return; }
  const dados = JSON.parse(raw);
  const ops = Array.isArray(dados) ? dados.length : (dados.operacoes?.length ?? 0);
  if (!ops) { status('❌ Dados locais estão vazios.', 'err'); return; }
  await enviar(dados);
}

function restaurarArquivo(input) {
  const file = input.files[0];
  if (!file) return;
  status('Lendo arquivo…', 'info');
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const dados = JSON.parse(e.target.result);
      await enviar(dados);
    } catch(err) {
      status('❌ Arquivo inválido: ' + err.message, 'err');
    }
  };
  reader.readAsText(file);
}
</script>
</body>
</html>
